<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAYA - Fahm-ul-Quran</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#211d0f,#000 65%);color:#fff;font-family:'Poppins',sans-serif;padding-bottom:40px}
.header{text-align:center;padding:45px 20px 10px}
.header h1{font-family:'Amiri',serif;font-size:46px;color:#D4AF37;margin:0;text-shadow:0 0 25px #D4AF3766;letter-spacing:2px}
.header p{opacity:.6;font-size:13px;margin-top:5px}
.glass{backdrop-filter:blur(14px);background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid rgba(212,175,55,.3);border-radius:22px;padding:22px;margin:16px auto;max-width:700px;box-shadow:0 10px 35px rgba(0,0,0,.6)}
.gold{color:#D4AF37}
.btn{width:100%;background:linear-gradient(90deg,#D4AF37,#f6e58d);color:#000;border:none;padding:14px;border-radius:30px;font-weight:700;font-size:15px;margin-top:10px;cursor:pointer}
.btn2{background:transparent;color:#D4AF37;border:1px solid #D4AF37}
select,textarea{width:100%;padding:14px;border-radius:14px;border:1px solid rgba(212,175,55,.4);background:#0c0c0c;color:#fff;margin-top:10px}
#count{font-size:68px;font-weight:800;color:#D4AF37;text-align:center;margin:10px 0}
.ayah{background:rgba(0,0,0,.5);border-left:3px solid #D4AF37;border-radius:14px;padding:14px;margin:10px 0;text-align:left;line-height:2}
.pill{display:inline-block;background:rgba(212,175,55,.15);color:#D4AF37;padding:4px 12px;border-radius:20px;font-size:11px}
</style>
</head>
<body>

<div class="header">
<h1>HAYA 🌙</h1>
<p>Fahm-ul-Quran - Quran ko samajh kar jeena</p>
</div>

<div class="glass">
<span class="pill">✨ Aaj ka Paigham</span>
<h3 id="dailyAyah" class="gold" style="line-height:1.8;margin-top:12px"></h3>
</div>

<div class="glass" style="text-align:center">
<span class="pill">TASBEEH</span>
<h2 class="gold" style="margin:8px 0">Digital Tasbeeh</h2>
<div id="count">0 / 33</div>
<div style="display:flex;gap:10px">
<button class="btn" onclick="addTasbeeh()">SUBHANALLAH 🤲</button>
<button class="btn btn2" style="width:35%" onclick="resetTasbeeh()">Reset</button>
</div>
</div>

<div class="glass">
<span class="pill">📖 MUKAMMAL QURAN PAK - 114 SURAH</span>
<h3 class="gold">Quran Majeed + Urdu Tarjuma</h3>
<select id="surahList" onchange="loadQuran()"></select>
<div id="quran-info" class="gold" style="margin-top:12px;font-size:13px"></div>
<div id="quran-container" style="margin-top:10px"></div>
</div>

<div class="glass">
<span class="pill">📝 DUA DIARY</span>
<h3 class="gold">Meri Dua Diary</h3>
<textarea id="duaInput" rows="4" placeholder="Ya Allah... apni dua yahan likho, auto-save ho jayegi"></textarea>
<button class="btn" onclick="shareDua()">WhatsApp Share 💌</button>
</div>

<div class="glass">
<span class="pill">🤲 MASNOON DUAIN</span>
<div id="duaList"></div>
</div>

<script>
// DAILY AYAH
const daily=["Beshak har mushkil ke sath asani hai [94:6]","Allah sabr karne walon ke sath hai [2:153]","Tum mujhe yaad karo main tumhe yaad karunga [2:152]","Aur jo Allah par bharosa kare Allah uske liye kafi hai [65:3]"];
document.getElementById('dailyAyah').innerText=daily[new Date().getDate()%daily.length];

// TASBEEH SAVE
let count=parseInt(localStorage.getItem('tasbeeh')||0);
function update(){document.getElementById('count').innerText=count+" / 33";localStorage.setItem('tasbeeh',count)}
update();
function addTasbeeh(){count++;if(count>33){count=0;alert("MashaAllah 33 mukammal! 🌸")}update();if(navigator.vibrate)navigator.vibrate(50)}
function resetTasbeeh(){count=0;update()}

// DUA DIARY
let duaInput=document.getElementById('duaInput');
duaInput.value=localStorage.getItem('myDua')||"";
duaInput.addEventListener('input',()=>localStorage.setItem('myDua',duaInput.value));
function shareDua(){window.open("https://wa.me/?text="+encodeURIComponent(duaInput.value))}

// 114 SURAH FULL LIST
const surahNames=["1-Al-Fatiha","2-Al-Baqarah","3-Aal-E-Imran","4-An-Nisa","5-Al-Maidah","6-Al-Anam","7-Al-Araf","8-Al-Anfal","9-At-Tawbah","10-Yunus","11-Hud","12-Yusuf","13-Ar-Rad","14-Ibrahim","15-Al-Hijr","16-An-Nahl","17-Al-Isra","18-Al-Kahf","19-Maryam","20-Ta-Ha","21-Al-Anbiya","22-Al-Hajj","23-Al-Muminun","24-An-Nur","25-Al-Furqan","26-Ash-Shuara","27-An-Naml","28-Al-Qasas","29-Al-Ankabut","30-Ar-Rum","31-Luqman","32-As-Sajda","33-Al-Ahzab","34-Saba","35-Fatir","36-Ya-Sin","37-As-Saffat","38-Sad","39-Az-Zumar","40-Ghafir","41-Fussilat","42-Ash-Shura","43-Az-Zukhruf","44-Ad-Dukhan","45-Al-Jathiya","46-Al-Ahqaf","47-Muhammad","48-Al-Fath","49-Al-Hujurat","50-Qaf","51-Adh-Dhariyat","52-At-Tur","53-An-Najm","54-Al-Qamar","55-Ar-Rahman","56-Al-Waqiah","57-Al-Hadid","58-Al-Mujadila","59-Al-Hashr","60-Al-Mumtahina","61-As-Saff","62-Al-Jumua","63-Al-Munafiqun","64-At-Taghabun","65-At-Talaq","66-At-Tahrim","67-Al-Mulk","68-Al-Qalam","69-Al-Haqqah","70-Al-Maarij","71-Nuh","72-Al-Jinn","73-Al-Muzzammil","74-Al-Muddathir","75-Al-Qiyamah","76-Al-Insan","77-Al-Mursalat","78-An-Naba","79-An-Naziat","80-Abasa","81-At-Takwir","82-Al-Infitar","83-Al-Mutaffifin","84-Al-Inshiqaq","85-Al-Buruj","86-At-Tariq","87-Al-Ala","88-Al-Ghashiyah","89-Al-Fajr","90-Al-Balad","91-Ash-Shams","92-Al-Lail","93-Ad-Duha","94-Al-Inshirah","95-At-Tin","96-Al-Alaq","97-Al-Qadr","98-Al-Bayyinah","99-Az-Zalzalah","100-Al-Adiyat","101-Al-Qariah","102-At-Takathur","103-Al-Asr","104-Al-Humazah","105-Al-Fil","106-Quraish","107-Al-Maun","108-Al-Kauthar","109-Al-Kafirun","110-An-Nasr","111-Al-Masad","112-Al-Ikhlas","113-Al-Falaq","114-An-Nas"];
let sel=document.getElementById('surahList');
surahNames.forEach((n,i)=>{let o=document.createElement('option');o.value=i+1;o.text=n;if(i+1==2)o.selected=true;sel.appendChild(o)});

async function loadQuran(){
let num=sel.value;
let cont=document.getElementById('quran-container');
let info=document.getElementById('quran-info');
cont.innerHTML="Quran Loading... 📖";
try{
let res=await fetch(`https://api.alquran.cloud/v1/surah/${num}/ur.junagarhi`);
let d=await res.json();
info.innerText=`${d.data.name} - ${d.data.englishName} | Total Ayahs: ${d.data.ayahs.length}`;
cont.innerHTML=d.data.ayahs.map(a=>`<div class="ayah"><b class="gold">Ayat ${a.numberInSurah}</b><div style="margin-top:6px">${a.text}</div></div>`).join('');
}catch(e){cont.innerHTML="Internet slow hai, dobara select karo 🌙"}
}
loadQuran();

// MASNOON DUAIN
const duas=[{t:"Subah ki Dua",d:"Allahumma bika asbahna"},{t:"Sone ki Dua",d:"Bismika Allahumma amutu wa ahya"},{t:"Pareshani ki Dua",d:"Allahumma la sahla illa ma ja'altahu sahla"}];
document.getElementById('duaList').innerHTML=duas.map(x=>`<div class="ayah"><b class="gold">${x.t}</b><p>${x.d}</p></div>`).join('');

// PWA
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
</html>
