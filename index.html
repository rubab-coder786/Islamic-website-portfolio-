<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAYA - Fahm-ul-Quran</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fefcf6;color:#222;font-family:'Poppins',sans-serif}
.topbar{position:sticky;top:0;background:#000;color:#D4AF37;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;z-index:100}
.topbar h1{margin:0;font-family:'Amiri';font-size:26px;letter-spacing:1px}
.menu-btn{font-size:24px;background:none;border:none;color:#D4AF37;cursor:pointer}
#sidebar{position:fixed;top:0;left:-280px;width:260px;height:100%;background:#0a0a0a;color:#fff;padding:20px;transition:.3s;z-index:200;overflow-y:auto}
#sidebar.open{left:0}
#sidebar h3{color:#D4AF37}
#sidebar select{width:100%;padding:12px;border-radius:10px;background:#111;color:#fff;border:1px solid #D4AF37;margin:10px 0}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:none;z-index:150}
#overlay.show{display:block}
.content{max-width:750px;margin:0 auto;padding:20px 18px}
.ayah{padding:28px 0;border-bottom:1px solid #e8e0c5}
.ayah:last-child{border:none}
.num{color:#D4AF37;font-size:12px;font-weight:600;letter-spacing:1px}
.arabic{font-family:'Amiri',serif;font-size:26px;text-align:right;direction:rtl;line-height:2.2;color:#111;margin:12px 0}
.urdu{font-size:15px;line-height:2;color:#333}
.english{font-size:13px;line-height:1.8;color:#777;margin-top:8px}
#countBox{text-align:center;padding:30px 0;border-bottom:1px solid #eee}
#count{font-size:56px;color:#D4AF37;font-weight:700}
.btn{background:#111;color:#D4AF37;border:1px solid #D4AF37;padding:12px 22px;border-radius:30px;margin:6px}
</style>
</head>
<body>

<div class="topbar">
<button class="menu-btn" onclick="toggleMenu()">☰</button>
<h1>HAYA 🌙</h1>
<button class="menu-btn" style="font-size:14px">فہم القرآن</button>
</div>

<div id="sidebar">
<h3>HAYA 🌙</h3>
<p style="font-size:12px;opacity:.6">Fahm-ul-Quran</p>
<hr style="border:0;border-top:1px solid #222;margin:15px 0">

<label style="font-size:13px;color:#D4AF37">Quran - 114 Surah</label>
<select id="surahList" onchange="loadQuran();toggleMenu()"></select>

<div style="margin-top:30px">
<p style="font-size:12px">Digital Tasbeeh</p>
<div id="countSide" style="font-size:32px;color:#D4AF37">0 / 33</div>
<button class="btn" style="width:100%" onclick="addTasbeeh()">SubhanAllah</button>
</div>

<p style="font-size:11px;opacity:.4;margin-top:40px">Quran API: AlQuran.Cloud<br>Urdu: Junagarhi | English: M. Asad</p>
</div>
<div id="overlay" onclick="toggleMenu()"></div>

<div class="content">
<div id="quran-info" style="text-align:center;color:#D4AF37;font-weight:600;margin:10px 0"></div>
<div id="quran-container">Loading Mukammal Quran... 📖</div>
</div>

<script>
function toggleMenu(){
 document.getElementById('sidebar').classList.toggle('open');
 document.getElementById('overlay').classList.toggle('show');
}
const surahNames=["1-Al-Fatiha","2-Al-Baqarah","3-Aal-E-Imran","4-An-Nisa","5-Al-Maidah","6-Al-Anam","7-Al-Araf","8-Al-Anfal","9-At-Tawbah","10-Yunus","11-Hud","12-Yusuf","13-Ar-Rad","14-Ibrahim","15-Al-Hijr","16-An-Nahl","17-Al-Isra","18-Al-Kahf","19-Maryam","20-Ta-Ha","21-Al-Anbiya","22-Al-Hajj","23-Al-Muminun","24-An-Nur","25-Al-Furqan","26-Ash-Shuara","27-An-Naml","28-Al-Qasas","29-Al-Ankabut","30-Ar-Rum","31-Luqman","32-As-Sajda","33-Al-Ahzab","34-Saba","35-Fatir","36-Ya-Sin","37-As-Saffat","38-Sad","39-Az-Zumar","40-Ghafir","41-Fussilat","42-Ash-Shura","43-Az-Zukhruf","44-Ad-Dukhan","45-Al-Jathiya","46-Al-Ahqaf","47-Muhammad","48-Al-Fath","49-Al-Hujurat","50-Qaf","51-Adh-Dhariyat","52-At-Tur","53-An-Najm","54-Al-Qamar","55-Ar-Rahman","56-Al-Waqiah","57-Al-Hadid","58-Al-Mujadila","59-Al-Hashr","60-Al-Mumtahina","61-As-Saff","62-Al-Jumua","63-Al-Munafiqun","64-At-Taghabun","65-At-Talaq","66-At-Tahrim","67-Al-Mulk","68-Al-Qalam","69-Al-Haqqah","70-Al-Maarij","71-Nuh","72-Al-Jinn","73-Al-Muzzammil","74-Al-Muddathir","75-Al-Qiyamah","76-Al-Insan","77-Al-Mursalat","78-An-Naba","79-An-Naziat","80-Abasa","81-At-Takwir","82-Al-Infitar","83-Al-Mutaffifin","84-Al-Inshiqaq","85-Al-Buruj","86-At-Tariq","87-Al-Ala","88-Al-Ghashiyah","89-Al-Fajr","90-Al-Balad","91-Ash-Shams","92-Al-Lail","93-Ad-Duha","94-Al-Inshirah","95-At-Tin","96-Al-Alaq","97-Al-Qadr","98-Al-Bayyinah","99-Az-Zalzalah","100-Al-Adiyat","101-Al-Qariah","102-At-Takathur","103-Al-Asr","104-Al-Humazah","105-Al-Fil","106-Quraish","107-Al-Maun","108-Al-Kauthar","109-Al-Kafirun","110-An-Nasr","111-Al-Masad","112-Al-Ikhlas","113-Al-Falaq","114-An-Nas"];
let sel=document.getElementById('surahList');
surahNames.forEach((n,i)=>{let o=document.createElement('option');o.value=i+1;o.text=n;if(i+1==2)o.selected=true;sel.appendChild(o)});

let count=parseInt(localStorage.getItem('tasbeeh')||0);
function update(){document.getElementById('countSide').innerText=count+" / 33";localStorage.setItem('tasbeeh',count)}
update();
function addTasbeeh(){count++;if(count>33){count=0;alert("MashaAllah!")}update();}

async function loadQuran(){
let num=sel.value;
let cont=document.getElementById('quran-container');
let info=document.getElementById('quran-info');
cont.innerHTML="<p style='text-align:center;opacity:.5'>Loading...</p>";
try{
let [ar,ur,en]=await Promise.all([
 fetch(`https://api.alquran.cloud/v1/surah/${num}`).then(r=>r.json()),
 fetch(`https://api.alquran.cloud/v1/surah/${num}/ur.junagarhi`).then(r=>r.json()),
 fetch(`https://api.alquran.cloud/v1/surah/${num}/en.asad`).then(r=>r.json())
]);
info.innerText=`${ar.data.englishName} - ${ar.data.name} | ${ar.data.numberOfAyahs} Ayahs`;
let html="";
for(let i=0;i<ar.data.ayahs.length;i++){
html+=`<div class="ayah"><div class="num">AYAT ${ar.data.ayahs[i].numberInSurah}</div><div class="arabic">${ar.data.ayahs[i].text}</div><div class="urdu">${ur.data.ayahs[i].text}</div><div class="english">${en.data.ayahs[i].text}</div></div>`;
}
cont.innerHTML=html;
window.scrollTo(0,0);
}catch(e){cont.innerHTML="Internet check karo"}
}
loadQuran();
</script>
</body>
</html>
